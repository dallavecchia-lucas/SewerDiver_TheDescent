<!doctype html><html><body><canvas id="cv" width="64" height="64"></canvas><script type="module">
import * as THREE from 'three/webgpu';
import { Fn, uniform, uniformArray, texture, vec3, vec4, Loop, screenUV } from 'three/tsl';
const log = (s) => (window.__log = (window.__log||'') + s + ';');
const r = new THREE.WebGPURenderer({ canvas: document.getElementById('cv') });
await r.init(); r.backend.device.lost.then(i => log('lost:' + i.message));
const variant = location.hash.slice(1);
const rt = new THREE.RenderTarget(4, 4, { type: variant.includes('half') ? THREE.HalfFloatType : THREE.UnsignedByteType, depthBuffer: false });
const arr = uniformArray([new THREE.Vector4(0.2,0,0,0), new THREE.Vector4(0,0.2,0,0)], 'vec4');
const n = uniform(2, 'int');
const m = new THREE.NodeMaterial();
m.fragmentNode = Fn(() => {
  const s = vec3(0.1).toVar();
  if (variant.includes('loop')) Loop(n, ({ i }) => { s.addAssign(arr.element(i).xyz); });
  if (variant.includes('arr')) s.addAssign(arr.element(1).xyz);
  return vec4(s, 1);
})();
const q = new THREE.QuadMesh(m);
r.setRenderTarget(rt); q.render(r); log('rendered'); if (variant.includes('canvas')) { r.setRenderTarget(null); q.render(r); log('canvas'); await new Promise(res=>setTimeout(res,500)); }
try { const px = await r.readRenderTargetPixelsAsync(rt, 0, 0, 4, 4); log('px ' + Array.from(px.slice(0,4))); } catch (e) { log('rderr ' + e); }
window.__done = 1;
</script></body></html>
