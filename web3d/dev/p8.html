<!doctype html><html><body><canvas id="cv" width="64" height="64"></canvas><script type="module">
import * as THREE from 'three/webgpu';
import { Fn, texture, vec4, screenUV, float } from 'three/tsl';
const log = (s) => (window.__log = (window.__log||'') + s + ';');
const r = new THREE.WebGPURenderer({ canvas: document.getElementById('cv'), forceWebGL: location.hash.includes('webgl') });
await r.init();
const A = new THREE.RenderTarget(8, 8, { depthBuffer: false, type: THREE.HalfFloatType });
const B = new THREE.RenderTarget(8, 8, { depthBuffer: false });
const q = new THREE.QuadMesh();
const m1 = new THREE.NodeMaterial(); m1.fragmentNode = vec4(screenUV.x, screenUV.y, 0, 1);
const tA = texture(A.texture);
const m2 = new THREE.NodeMaterial(); m2.fragmentNode = Fn(() => texture(tA, screenUV).level(0))();
q.material = m1; r.setRenderTarget(A); q.render(r);
q.material = m2; r.setRenderTarget(B); q.render(r);
const px = await r.readRenderTargetPixelsAsync(B, 0, 0, 8, 8);
// report the green (screenUV.y) of the first and last rows of the readback buffer
log('backend ' + (r.backend.isWebGPUBackend ? 'webgpu' : 'webgl') + ' row0 g=' + px[1] + ' rowLast g=' + px[(7*8)*4+1] + ' col0 r=' + px[0] + ' colLast r=' + px[7*4]);
window.__done = 1;
</script></body></html>
