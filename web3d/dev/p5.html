<!doctype html><html><body><canvas id="cv" width="64" height="64"></canvas><script type="module">
import * as THREE from 'three/webgpu';
const log = (s) => (window.__log = (window.__log||'') + s + ';');
const r = new THREE.WebGPURenderer({ canvas: document.getElementById('cv') });
try { await r.init(); log('init ' + r.backend.isWebGPUBackend); } catch (e) { log('initerr ' + e); }
const dev = r.backend.device; if (dev) dev.lost.then(i => log('lost:' + i.message));
await new Promise(res => setTimeout(res, 1500)); log('after wait');
const rt = new THREE.RenderTarget(4, 4);
r.setRenderTarget(rt); r.setClearColor(0xff8800, 1); r.clear(); log('cleared');
try { const px = await r.readRenderTargetPixelsAsync(rt, 0, 0, 4, 4); log('px ' + Array.from(px.slice(0,4))); } catch (e) { log('rderr ' + e); }
window.__done = 1;
</script></body></html>
